services:
  profile_db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-profile}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-ummu_profile}
    ports:
      - "127.0.0.1:${DB_PORT_PUBLISHED:-54322}:5432"
    volumes:
      - profile_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - profile_net

  profile_service:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        ummu-go-auth: ../ummu-go-outh
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: profile_db
      DB_PORT: "5432"
      JWKS_URL: ${JWKS_URL:-http://auth_service:9001/.well-known/jwks.json}
      AVATAR_STORAGE_DIR: ${AVATAR_STORAGE_DIR:-/data/avatars}
    expose:
      - "${APP_PORT:-9002}"
    volumes:
      - ./data/avatars:/data/avatars
    depends_on:
      profile_db:
        condition: service_healthy
    networks:
      - profile_net
      - auth_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${APP_PORT}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  profile_db_data:

networks:
  profile_net:
    driver: bridge
  auth_net:
    external: true
    name: ${AUTH_DOCKER_NETWORK:-auth-service_auth_net}
